# Builds the EvenG1 iOS app as an (unsigned) IPA and publishes it as a GitHub
# Release asset — ready for sideloading, e.g. via SideStore (https://sidestore.io).
#
# Job 1 (build-unsigned) ALWAYS runs and uploads an unsigned IPA:
#   build/ios/unsigned-ipa/Runner.ipa  -> artifact "even-g1-ipa-unsigned"
# The IPA is unsigned on purpose: SideStore (or AltStore) re-signs it with
# your own Apple ID, so no certificate / provisioning profile is needed.
#
# Job 2 (release) publishes the IPA as a GitHub Release asset:
#   - push to main            -> updates the rolling release tagged "latest"
#   - tag push "v*"           -> versioned release (tag = pushed tag)
#   - manual workflow run     -> release under the "Release tag" input (default "latest")
name: iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag for the GitHub Release (empty = latest)"
        type: string
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version
          xcodebuild -version

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: CocoaPods install
        run: cd ios && pod install

      # --no-codesign only produces the .xcarchive (build/ios/archive/Runner.xcarchive).
      # xcodebuild -exportArchive refuses to export without a team/certificate, so we
      # package the standard IPA layout (Payload/Runner.app) from the archive directly.
      - name: Build archive
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APPS=build/ios/archive/Runner.xcarchive/Products/Applications
          OUT=build/ios/unsigned-ipa
          rm -rf "$OUT" "$OUT.tmp"
          mkdir -p "$OUT" "$OUT.tmp/Payload"
          cp -R "$APPS/Runner.app" "$OUT.tmp/Payload/Runner.app"
          (cd "$OUT.tmp" && zip -qrX Runner.ipa Payload)
          mv "$OUT.tmp/Runner.ipa" "$OUT/Runner.ipa"
          rm -rf "$OUT.tmp"
          unzip -l "$OUT/Runner.ipa" | head -15
          # fail loudly if the IPA structure is ever wrong
          unzip -l "$OUT/Runner.ipa" | grep -q "Payload/Runner.app/Runner"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: even-g1-ipa-unsigned
          path: build/ios/unsigned-ipa/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [analyze-test, build-unsigned]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    permissions:
      contents: write
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: even-g1-ipa-unsigned
          path: dist

      - name: Determine release tag
        id: rel
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            TAG="${REF#refs/tags/}"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$TAGIN" ]; then
            TAG="$TAGIN"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release under tag: $TAG"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAGIN: ${{ inputs.release-tag }}

      - name: Prepare release files
        run: mv dist/Runner.ipa dist/EvenG1-ios-unsigned.ipa

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: EvenG1 iOS ${{ steps.rel.outputs.tag }}
          body: |
            Unsigned iOS build — for sideloading, e.g. via [SideStore](https://sidestore.io).
            - Commit: `${{ github.sha }}`
            - Trigger: ${{ github.event_name }}
          files: dist/*.ipa
          overwrite: true
