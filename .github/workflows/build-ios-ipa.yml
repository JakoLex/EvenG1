# Builds the EvenG1 iOS app as an IPA on every push to main (and on demand).
#
# Job 1 (build-unsigned) ALWAYS runs and uploads an unsigned IPA:
#   build/ios/ipa/Runner.ipa  -> artifact "even-g1-ipa-unsigned"
# An unsigned IPA can be signed later with Xcode (Open in Xcode > Product > Archive > Distribute)
# or by enabling the sign job below.
#
# Job 2 (sign) runs ONLY when the following repo secrets/variables exist:
#   secrets.IOS_CERT_P12_BASE64        base64 of the Apple Development/App Store .p12 certificate
#   secrets.IOS_CERT_P12_PASSWORD      password of that .p12
#   secrets.IOS_PROVISION_PROFILE_BASE64  base64 of the .mobileprovision profile
#   vars.IOS_PROFILE_NAME              (optional) profile file name, default "EvenG1"
#   vars.IOS_TEAM_ID                   Apple Team ID used for export
#   vars.IOS_EXPORT_METHOD             (optional) export method, default "app-store" (or "ad-hoc")
name: iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40
    outputs:
      signing-enabled: ${{ steps.signing-check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          pod --version
          xcodebuild -version

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: CocoaPods install
        run: cd ios && pod install

      # --no-codesign only produces the .xcarchive (build/ios/archive/Runner.xcarchive),
      # so we export an unsigned IPA from it with signingStyle "none".
      - name: Build archive
        run: flutter build ipa --release --no-codesign

      - name: Export unsigned IPA
        run: |
          set -euo pipefail
          cat > unsigned-export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>none</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist unsigned-export.plist \
            -exportPath build/ios/unsigned-ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: even-g1-ipa-unsigned
          path: build/ios/unsigned-ipa/*.ipa
          if-no-files-found: error

      - name: Check signing secrets
        id: signing-check
        run: |
          if [ -n "$IOS_CERT_P12_BASE64" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

  sign:
    name: Sign IPA
    runs-on: macos-14
    timeout-minutes: 40
    needs: build-unsigned
    if: needs.build-unsigned.outputs.signing-enabled == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: CocoaPods install
        run: cd ios && pod install

      - name: Create keychain and import certificate
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          KEYCHAIN=build.keychain
          security create-keychain -p "$IOS_CERT_P12_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$IOS_CERT_P12_PASSWORD" "$KEYCHAIN"
          security import /tmp/cert.p12 -P "$IOS_CERT_P12_PASSWORD" -A -t pkcs12 -k "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool,pkcs12 -s -k "$IOS_CERT_P12_PASSWORD" "$KEYCHAIN"
          shred -u /tmp/cert.p12

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME || 'EvenG1' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_NAME}.mobileprovision"

      - name: Build unsigned archive (input for export)
        run: flutter build ipa --release --no-codesign

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store' }}

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ios/signed-export

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: even-g1-ipa-signed
          path: build/ios/signed-export/*.ipa
          if-no-files-found: error
